name: NourishLink CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Sync DB
        run: |
          npx prisma db push
          npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Run Test Suite
        run: npm test

      - name: Build Next.js Production App
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-secret-key-12345"
